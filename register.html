<!DOCTYPE html>
<html>
<head>
  <title>Emergency Register</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="auth-box">

    <h1>🛡 Create Secure ID</h1>

    <p style="font-size:14px; opacity:0.8;">
      Register for Emergency Alert Access

    <input type="text" placeholder="Create User ID">

    </button>

    <p style="margin-top:10px;">
      Already registered? <a href="login.html">Login</a>
    </p>

  </div>

</body>
</html>
